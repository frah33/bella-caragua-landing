<script>
  document.getElementById('leadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = "Enviando...";
    submitBtn.disabled = true;

    const nome = document.getElementById('nome').value;
    const whatsapp = document.getElementById('whatsapp').value;
    const objetivo = document.getElementById('objetivo').value;
    
    const formspreeEndpoint = "https://formspree.io/f/xnpnqknj"; 
    
    fetch(formspreeEndpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        nome: nome,
        whatsapp: whatsapp,
        objetivo: objetivo,
        dataEnvio: new Date().toLocaleString('pt-BR')
      })
    }).then(response => {
      const numeroWhatsapp = "5512974089001";
      const texto = `Olá, Raphaella! Meu nome é ${nome}.\nTenho interesse em: ${objetivo}.\nMeu contato: ${whatsapp}`;
      const url = `https://wa.me/${numeroWhatsapp}?text=${encodeURIComponent(texto)}`;
      
      window.open(url, '_blank');
      submitBtn.innerText = "Falar no WhatsApp Agora";
      submitBtn.disabled = false;
    }).catch(error => {
      const numeroWhatsapp = "5512974089001";
      const texto = `Olá, Raphaella! Meu nome é ${nome}.\nTenho interesse em: ${objetivo}.\nMeu contato: ${whatsapp}`;
      window.open(`https://wa.me/${numeroWhatsapp}?text=${encodeURIComponent(texto)}`, '_blank');
      submitBtn.innerText = "Falar no WhatsApp Agora";
      submitBtn.disabled = false;
    });
  });
</script>
